<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教師版抽籤系統(精簡版)</title>

<style>
:root {
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #0f172a;
    --border-color: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --success: #10b981;
    --success-hover: #059669;
    --accent: #facc15;
}

* {
    box-sizing: border-box;
}

body {
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    margin: 0;
    padding: 16px;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 主容器：縮小最大寬度與高度 */
.container {
    display: grid;
    grid-template-columns: 1fr 280px; /* 右欄縮窄至 280px */
    gap: 16px; /* 間距縮小 */
    width: 100%;
    max-width: 1050px; /* 寬度從 1400px 縮小 */
    height: calc(100vh - 32px);
    max-height: 700px; /* 限制最大高度，避免在大螢幕上拉得太長 */
}

/* 左側主畫面佈局 */
.main-content {
    display: flex;
    flex-direction: column;
    gap: 14px;
    height: 100%;
}

h1 {
    margin: 0;
    font-size: 22px; /* 標題縮小 */
    display: flex;
    align-items: center;
    gap: 8px;
}

/* 卡片內襯縮小 */
.card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px; /* 內襯縮小 */
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
}

/* 設定面板佈局 */
.panel {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.input-group.flex-1 {
    flex: 1;
    min-width: 180px;
}

label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
}

input {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: white;
    padding: 8px 12px; /* 輸入框變小 */
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: all .2s;
    width: 90px;
    text-align: center;
}

input#exclude {
    width: 100%;
    text-align: left;
}

input:focus {
    border-color: var(--primary);
}

/* 按鈕小調整 */
.btn-group {
    display: flex;
    gap: 8px;
    margin-left: auto;
}

button {
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.btn-secondary {
    background: #334155;
    color: var(--text-primary);
    border: 1px solid #475569;
}

.btn-secondary:hover {
    background: #475569;
}

/* 抽籤按鈕縮小 */
.btn-draw {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    font-size: 18px; /* 縮小字體 */
    padding: 12px 36px; /* 縮小尺寸 */
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
    margin-top: 10px;
}

.btn-draw:hover {
    transform: translateY(-1px);
}

/* 核心抽籤展示區 */
.display-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

#remain {
    position: absolute;
    top: 14px;
    left: 14px;
    font-size: 14px;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.1);
    padding: 4px 12px;
    border-radius: 50px;
    border: 1px solid rgba(56, 189, 248, 0.15);
}

/* 重點：幸運數字縮小 */
#number {
    font-size: 140px; /* 從 240px 縮小到 140px */
    font-weight: 800;
    color: var(--accent);
    margin: 5px 0;
    text-shadow: 0 0 40px rgba(250, 204, 21, 0.25);
    line-height: 1;
    user-select: none;
}

.winner {
    animation: pop .6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes pop {
    0% { transform: scale(0.7); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

/* 右側歷史紀錄欄 */
.sidebar {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.sidebar h2 {
    margin: 0 0 12px 0;
    font-size: 16px; /* 縮小標題 */
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px;
}

#history {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px; /* 標籤間距縮小 */
    padding-right: 4px;
}

#history::-webkit-scrollbar {
    width: 4px;
}
#history::-webkit-scrollbar-thumb {
    background: #475569;
    border-radius: 10px;
}

/* 歷史紀錄標籤縮小 */
.history-badge {
    background: #273549;
    border: 1px solid #3d4f68;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    color: white;
    display: flex;
    align-items: center;
    gap: 6px;
}

.history-idx {
    font-size: 10px;
    background: var(--bg-main);
    color: var(--text-secondary);
    padding: 1px 4px;
    border-radius: 3px;
}

.empty-tip {
    color: var(--text-secondary);
    font-size: 13px;
    text-align: center;
    width: 100%;
    margin-top: 30px;
    font-style: italic;
}

@media (max-width: 850px) {
    body { height: auto; }
    .container { grid-template-columns: 1fr; height: auto; max-height: none; }
    .display-card { min-height: 320px; }
    .sidebar { max-height: 300px; }
}
</style>
</head>

<body>

<div class="container">
    
    <div class="main-content">
        <h1>🎲 教師版抽籤系統</h1>
        
        <div class="card panel">
            <div class="input-group">
                <label>起始號碼</label>
                <input id="start" type="number" value="1">
            </div>
            
            <div class="input-group">
                <label>結束號碼</label>
                <input id="end" type="number" value="25">
            </div>
            
            <div class="input-group flex-1">
                <label>排除號碼 (例如：5,8,12)</label>
                <input id="exclude" type="text" placeholder="無排除號碼">
            </div>
            
            <div class="btn-group">
                <button class="btn-secondary" onclick="resetLottery()">🔄 重設</button>
                <button class="btn-secondary" onclick="fullscreenMode()">📺 全螢幕</button>
            </div>
        </div>
        
        <div class="card display-card">
            <div id="remain">剩餘人數：0</div>
            <div id="number">?</div>
            <button class="btn-draw" onclick="draw()">⚡ 開始抽籤</button>
        </div>
    </div>
    
    <div class="card sidebar">
        <h2>📜 已抽出歷史紀錄</h2>
        <div id="history">
            <div class="empty-tip">暫無抽籤紀錄</div>
        </div>
    </div>

</div>

<script>
let drawn=[];

function getAvailable(){
    const start= parseInt(document.getElementById("start").value);
    const end= parseInt(document.getElementById("end").value);
    const excludeText= document.getElementById("exclude").value;

    const excludes=excludeText
        .split(",")
        .map(x=>parseInt(x.trim()))
        .filter(x=>!isNaN(x));

    let arr=[];
    for(let i=start;i<=end;i++){
        if(!drawn.includes(i) && !excludes.includes(i)){
            arr.push(i);
        }
    }
    return arr;
}

function updateRemain(){
    document.getElementById("remain").innerHTML="剩餘人數："+getAvailable().length;
}

function updateHistoryUI() {
    const historyBox = document.getElementById("history");
    if (drawn.length === 0) {
        historyBox.innerHTML = '<div class="empty-tip">暫無抽籤紀錄</div>';
    } else {
        historyBox.innerHTML = drawn.map((num, index) => `
            <div class="history-badge">
                <span class="history-idx">#${index + 1}</span>
                <span>${num}</span>
            </div>
        `).join('');
        historyBox.scrollTop = historyBox.scrollHeight;
    }
}

updateRemain();

function draw(){
    let available=getAvailable();

    if(available.length===0){
        alert("全部抽完了！");
        return;
    }

    let count=0;
    const interval=setInterval(()=>{
        const random= available[Math.floor(Math.random()*available.length)];
        document.getElementById("number").innerHTML=random;
        count++;

        if(count>=30){
            clearInterval(interval);

            const winner= available[Math.floor(Math.random()*available.length)];
            drawn.push(winner);

            const num= document.getElementById("number");
            num.innerHTML=winner;
            num.classList.remove("winner");
            void num.offsetWidth; 
            num.classList.add("winner");

            updateHistoryUI();
            updateRemain();
        }
    },100);
}

function resetLottery(){
    drawn=[];
    document.getElementById("number").innerHTML="?";
    updateHistoryUI();
    updateRemain();
}

function fullscreenMode(){
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}
</script>

</body>
</html>
